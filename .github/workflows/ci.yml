name: CI

on:
  push:
    branches: [main, develop, refactor/nextjs-fullstack]
  pull_request:
    branches: [main, develop, refactor/nextjs-fullstack]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest


    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Type check
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Deploy Supabase Edge Functions
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/refactor/nextjs-fullstack')
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "🚀 Deploying Supabase Edge Functions..."
            npx supabase functions deploy gemini-proxy --project-ref tjkytlstopieiqqiiisy --no-verify-jwt
            echo "✅ Edge Functions deployed successfully!"
          else
            echo "⚠️ SUPABASE_ACCESS_TOKEN secret not configured in GitHub repository. Skipping Edge Function deployment."
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}